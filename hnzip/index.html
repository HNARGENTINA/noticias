<style>
:root{color-scheme:dark;--bg:#07090a;--s1:#0e1214;--s2:#151a1d;--line:#222a2e;--tx:#eaf0ec;--mut:#7f8b85;--g:#39ff88;--cy:#38d3ff;--vi:#a78bfa;--am:#ffb02e;--rd:#ff4d5e;

html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(900px 500px at 85% -5%,#39ff8822,transparent 60%),radial-gradient(700px 500px at 0 40%,#a78bfa14,transparent 60%),
linear-gradient(#ffffff08 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/44px 44px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,#00000030 2px 3px);opacity:.5}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}.mono{font-family:var(--mono)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#07090af0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:58px}

nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}nav a{padding:7px 12px;border-radius:6px;font:13px var(--mono);color:var(--mut);white-space:nowrap}
nav a:hover,nav a[aria-current]{color:var(--g);background:#39ff8814}

.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 #39ff88aa;animation:pulse 2s infinite}.dot.r{background:var(--rd);box-shadow:0 0 0 0 #ff4d5eaa}.dot.a{background:var(--am);box-shadow:0 0 0 0 #ffb02eaa}

.hero{position:relative;padding:64px 0 40px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center}
.kick{font:700 12px var(--mono);letter-spacing:.2em;color:var(--g);display:flex;gap:10px;align-items:center}
.hero h1{font:900 clamp(44px,8.4vw,108px)/.92 var(--disp);letter-spacing:-.03em;margin:18px 0;text-transform:uppercase}

.lead{color:#b8c4bd;max-width:54ch;font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

.btn.fill{background:var(--g);color:#03120a;box-shadow:0 0 30px #39ff8855}.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px #39ff8866}

.blip{animation:bl 3s infinite}@keyframes bl{50%{opacity:.25}}
.glass{background:linear-gradient(160deg,#ffffff0a,#ffffff03);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);position:relative}
.glass::before{content:"";position:absolute;left:-1px;top:14px;width:3px;height:28px;background:var(--g);border-radius:2px;box-shadow:0 0 12px var(--g)}
.cap{position:absolute;right:0;bottom:0;font:11px var(--mono);color:var(--mut);background:var(--bg);padding:4px 8px;border:1px solid var(--line);border-radius:4px}
h2.sec{font:900 clamp(26px,4vw,40px)/1 var(--disp);text-transform:uppercase;margin:60px 0 6px;letter-spacing:-.01em}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.m{padding:20px}.m b{display:block;font:800 clamp(34px,5vw,54px)/1 var(--mono)}.m small{color:var(--mut);font-size:12px}.m svg{display:block;margin-top:10px}
.trace{stroke-dasharray:400;stroke-dashoffset:400;animation:dr 2.4s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}

.g{color:var(--g)}.c{color:var(--cy)}.v{color:var(--vi)}.a{color:var(--am)}.r{color:var(--rd)}
.ev{font:700 10px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:3px;background:#ffffff0d}
.feature{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.feature .big{padding:34px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:radial-gradient(500px 300px at 90% 0,#ff4d5e22,transparent),var(--s1)}
.big h3{font:900 clamp(28px,4.4vw,52px)/1 var(--disp);text-transform:uppercase;margin:14px 0}
.big::after{content:"RANSOM";position:absolute;right:-10px;top:-10px;font:900 120px var(--disp);color:#ffffff06;pointer-events:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:18px;transition:.2s;display:block}
a.card:hover{border-color:var(--g);transform:translateY(-3px);box-shadow:0 10px 40px #39ff8814}
.card h3{font-size:18px;margin:10px 0 6px}.card p{color:var(--mut);font-size:14px;margin:0 0 10px}
.stack{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.meta{font:12px var(--mono);color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.p{padding:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;font:12px var(--mono);cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--g);color:#03120a}
.bars{display:grid;gap:11px}.br{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.tr{height:12px;background:var(--s2);border-radius:6px;overflow:hidden}.fl{height:100%;background:linear-gradient(90deg,#39ff8855,var(--g));border-radius:6px;animation:gw 1s both}@keyframes gw{from{width:0!important}}
.inc{display:grid;gap:10px}.inc button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--s1);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:14px;cursor:pointer;font:inherit}
.inc button:hover,.inc button[aria-pressed=true]{border-color:var(--g);background:var(--s2)}
.sev{width:4px;align-self:stretch;border-radius:2px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--line)}.tl li{position:relative;margin-bottom:16px}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
/* graph */
.graph{padding:0;overflow:hidden}.graph svg{display:block;width:100%;height:auto;min-height:300px}
.gn{cursor:pointer;outline:none}.gn rect{fill:#10161a;stroke:#2b353a;transition:.2s}.gn:hover rect,.gn:focus-visible rect,.gn[aria-pressed=true] rect{stroke:var(--g);fill:#12201a}
.edge{stroke:#38d3ff55;stroke-width:1.5;fill:none}.edge.on{stroke:var(--g);stroke-width:2.2;stroke-dasharray:6 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}
.gd{padding:18px;border-top:1px solid var(--line);background:#0a0e10;min-height:120px}
svg text{font-family:var(--mono)}
.actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ac{padding:22px;overflow:hidden}.ac h3{font:900 28px var(--disp);text-transform:uppercase;margin:14px 0 4px}.sig{width:72px;height:72px}
.conf{display:flex;gap:3px;align-items:center;font:11px var(--mono)}.conf i{width:18px;height:6px;background:var(--line);border-radius:2px}.conf i.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.art{max-width:780px;margin:40px auto}.art h1{font:900 clamp(34px,6vw,64px)/1 var(--disp);text-transform:uppercase;margin:16px 0}.art h3{margin:30px 0 8px;font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.art p{color:#c4cec8}pre{background:var(--s1);border:1px solid var(--line);padding:14px;border-radius:8px;overflow-x:auto;font:13px var(--mono)}
.src{border-left:3px solid var(--cy);padding-left:14px;color:var(--mut);font-size:14px}
footer{margin-top:70px;border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font:12px var(--mono)}
@media(max-width:860px){.hero,.feature,.two{grid-template-columns:1fr}.hero{padding-top:36px}.radar{max-width:340px}.live.h{display:none}.br{grid-template-columns:80px 1fr 30px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.trace{stroke-dashoffset:0}}
</style>

<header><div class="wrap bar"><a class="logo" href="#/">HACKERNEWS<i>.com.ar</i></a><span class="live h"><span class="dot a"></span>MODO DEMO · SIN TELEMETRÍA REAL</span>

<script>
/* ===== MODELOS DE DATOS (reemplazar por NVD / ATT&CK / RSS) ===== */
const DATA={
 articles:[
 {id:"demo-1",tag:"Ransomware",col:"r",title:"Cifrado en cadena: anatomía de una campaña simulada",sum:"Informe de ejemplo que muestra cómo se estructuraría un análisis: acceso inicial, movimiento lateral, exfiltración e impacto, con cada afirmación etiquetada por nivel de evidencia.",date:"2026-10-18",read:"8 min",conf:2,ev:"SIMULADO",src:"Fuente demo A",cve:"CVE-0000-0000 (marcador)",ttp:["T1566","T1078","T1486"]},
 {id:"demo-2",tag:"Vulnerabilidad",col:"a",title:"Pasarela VPN ficticia: explotación sin autenticar",sum:"Tarjeta de muestra con puntaje CVSS y estado de explotación.",date:"2026-10-17",read:"4 min",conf:3,ev:"SIMULADO",src:"Fuente demo B",cve:"CVE-0000-0001 (marcador)",ttp:["T1190"]},
 {id:"demo-3",tag:"Phishing",col:"c",title:"Kits de suplantación bancaria (ejemplo)",sum:"Plantilla para campañas de ingeniería social regionales.",date:"2026-10-16",read:"5 min",conf:1,ev:"ALEGACIÓN",src:"Fuente demo C",cve:"—",ttp:["T1566"]},
 {id:"demo-4",tag:"Supply chain",col:"v",title:"Paquete malicioso en repositorio (ejemplo)",sum:"Plantilla para compromisos de dependencias.",date:"2026-10-15",read:"7 min",conf:2,ev:"ESTIMACIÓN",src:"Fuente demo D",cve:"—",ttp:["T1195"]}],
 incidents:[
 {id:"i1",sev:"r",name:"Incidente DEMO-001",sector:"Salud (ficticio)",stage:"Impacto",conf:2,t:"hace 12 min",d:"Simulación de cifrado masivo detectado en entorno de laboratorio."},
 {id:"i2",sev:"a",name:"Incidente DEMO-002",sector:"Finanzas (ficticio)",stage:"Acceso inicial",conf:3,t:"hace 47 min",d:"Simulación de campaña de phishing con kit de captura de credenciales."},
 {id:"i3",sev:"c",name:"Incidente DEMO-003",sector:"Gobierno (ficticio)",stage:"Reconocimiento",conf:1,t:"hace 3 h",d:"Simulación de escaneo de servicios expuestos."}],
 sectors:[["Salud",42],["Finanzas",35],["Gobierno",28],["Energía",19],["Educación",14]],
 trend:{"7d":[3,5,4,8,6,9,7],"30d":[4,6,5,7,9,8,6,10,12,9,11,13],"90d":[5,6,8,7,9,11,10,12,14,13,15,17]},
 actors:[
 {id:"a1",name:"Actor Demo-01",kind:"Cibercrimen",col:"r",conf:1,tag:"SIMULADO",desc:"Grupo ficticio con motivación financiera. Perfil de muestra sin atribución real.",ttps:["T1566","T1078","T1486"],hist:[["2026-03","Primera actividad simulada"],["2026-07","Cambio de herramientas (demo)"]]},

 {id:"a3",name:"Actor Demo-03",kind:"Hacktivismo",col:"c",conf:1,tag:"SIMULADO",desc:"Colectivo ficticio con actividad de disrupción. Tercer perfil de muestra.",ttps:["T1190","T1041"],hist:[["2026-05","Primera mención (demo)"]]}],
 ttp:{T1566:"Phishing",T1078:"Cuentas válidas",T1486:"Cifrado de datos con fines de impacto",T1190:"Explotar aplicación expuesta",T1059:"Intérprete de comandos y scripts",T1041:"Exfiltración por canal C2",T1195:"Compromiso de cadena de suministro",T1021:"Servicios remotos",T1003:"Volcado de credenciales"},
 graph:{nodes:[
  {id:"n1",x:70,y:60,l:"Acceso inicial",t:"T1566",d:"Un correo de suplantación entrega al atacante su primera credencial. Fase típica de toda cadena."},
  {id:"n2",x:70,y:190,l:"Cuentas válidas",t:"T1078",d:"Uso de credenciales robadas para evitar alertas de explotación."},
  {id:"n3",x:300,y:60,l:"Ejecución",t:"T1059",d:"Scripts y comandos nativos para ejecutar cargas sin dejar binarios evidentes."},
  {id:"n4",x:300,y:190,l:"Credenciales",t:"T1003",d:"Obtención de más credenciales para ampliar el alcance."},
  {id:"n5",x:530,y:125,l:"Mov. lateral",t:"T1021",d:"Acceso a otros equipos mediante servicios remotos legítimos."},
  {id:"n6",x:760,y:60,l:"Exfiltración",t:"T1041",d:"Salida de datos por el mismo canal de control del atacante."},
  {id:"n7",x:760,y:190,l:"Impacto",t:"T1486",d:"Cifrado de sistemas para interrumpir la operación y exigir pago."}],
  edges:[["n1","n3"],["n1","n2"],["n2","n4"],["n3","n5"],["n4","n5"],["n5","n6"],["n5","n7"]]}
};
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CL={1:"BAJA",2:"MEDIA",3:"ALTA"};
const Conf=n=>`<span class="conf" title="Confianza ${CL[n]}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")} ${CL[n]}</span>`;
const Ev=e=>`<span class="ev ${{VERIFICADO:"g",ALEGACIÓN:"c",ESTIMACIÓN:"a",SIMULADO:"v"}[e]}">${e}</span>`;
const Spark=(v,w=160,h=40)=>{const m=Math.max(...v),p=v.map((y,i)=>(i?"L":"M")+(i*w/(v.length-1)).toFixed(1)+" "+(h-3-y/m*(h-8)).toFixed(1)).join(" ");return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" aria-hidden="true"><path class="trace" d="${p}" fill="none" stroke="#39ff88" stroke-width="2"/></svg>`};
const Line=v=>{const w=560,h=190,m=Math.max(...v),pts=v.map((y,i)=>[i*w/(v.length-1),h-14-y/m*(h-34)]),d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Actividad simulada"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity=".35"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient></defs>
 ${[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" stroke="#222a2e"/>`).join("")}<path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#lg)"/><path class="trace" d="${d}" fill="none" stroke="#39ff88" stroke-width="2.5"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#07090a" stroke="#39ff88"/>`).join("")}</svg>`};
const Bars=r=>{const m=Math.max(...r.map(x=>x[1]));return `<div class="bars">${r.map(x=>`<div class="br"><span>${x[0]}</span><div class="tr"><div class="fl" style="width:${x[1]/m*100}%"></div></div><span class="mono">${x[1]}</span></div>`).join("")}</div>`};
const Sigil=(a)=>{const h=[...a.id].reduce((s,c)=>s*31+c.charCodeAt(0),7),n=5+h%3,pts=[...Array(n)].map((_,i)=>{const r=14+(h>>i)%18,t=i/n*6.283;return (36+r*Math.cos(t)).toFixed(1)+","+(36+r*Math.sin(t)).toFixed(1)}).join(" ");
 const c={r:"#ff4d5e",v:"#a78bfa",c:"#38d3ff"}[a.col];return `<svg class="sig" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="33" fill="none" stroke="${c}" stroke-opacity=".4"/><polygon points="${pts}" fill="${c}22" stroke="${c}" stroke-width="1.5"/><circle cx="36" cy="36" r="3" fill="${c}"/></svg>`};
const Card=a=>`<a class="card" href="#/articulo/${a.id}"><span class="tag ${a.col}">${a.tag}</span> <span class="demo">DEMO</span><h3>${esc(a.title)}</h3><p>${esc(a.sum.slice(0,110))}…</p><div class="meta"><span>${a.date}</span>${Ev(a.ev)}${Conf(a.conf)}</div></a>`;
const Radar=()=>`<div class="radar glass"><div class="sweep"></div><svg viewBox="0 0 400 400" aria-hidden="true">${[190,140,90,40].map(r=>`<circle cx="200" cy="200" r="${r}" fill="none" stroke="#39ff8830"/>`).join("")}<path d="M200 10V390M10 200H390" stroke="#39ff8822"/>
${[[130,110,"#ff4d5e"],[270,150,"#ffb02e"],[240,290,"#38d3ff"],[110,260,"#a78bfa"],[300,240,"#39ff88"]].map((b,i)=>`<circle class="blip" style="animation-delay:${i*.6}s" cx="${b[0]}" cy="${b[1]}" r="6" fill="${b[2]}"/><circle cx="${b[0]}" cy="${b[1]}" r="13" fill="none" stroke="${b[2]}" stroke-opacity=".5"/>`).join("")}</svg><span class="cap">SIMULACIÓN · SIN TELEMETRÍA REAL</span></div>`;
const Graph=sel=>{const G=DATA.graph,N=Object.fromEntries(G.nodes.map(n=>[n.id,n])),s=sel&&N[sel];
 return `<div class="glass graph"><svg viewBox="0 0 930 270" role="group" aria-label="Grafo de ataque ilustrativo">${G.edges.map(e=>{const a=N[e[0]],b=N[e[1]],on=sel&&(e[0]===sel||e[1]===sel);return `<path class="edge ${on?"on":""}" d="M${a.x+130} ${a.y+30}C${a.x+190} ${a.y+30},${b.x-60} ${b.y+30},${b.x} ${b.y+30}"/>`}).join("")}
 ${G.nodes.map(n=>`<g class="gn" tabindex="0" role="button" aria-pressed="${n.id===sel}" data-n="${n.id}" transform="translate(${n.x},${n.y})"><rect width="130" height="60" rx="8"/><text x="12" y="26" fill="#eaf0ec" font-size="13" font-weight="700">${n.l}</text><text x="12" y="46" fill="#39ff88" font-size="12">${n.t}</text></g>`).join("")}</svg>
 <div class="gd" id="gd">${s?`<span class="tag g">${s.t}</span> <b>${DATA.ttp[s.t]}</b> ${Ev("SIMULADO")}<p style="margin:10px 0 0;color:#c4cec8">${s.d}</p>`:`<span class="mono" style="color:var(--mut)">Selecciona un nodo para ver su técnica ATT&amp;CK y las conexiones resaltadas. Grafo ilustrativo, no atribuido a ningún actor real.</span>`}</div></div>`};

/* ===== VISTAS ===== */
const Home=()=>{const[f,...r]=DATA.articles;return `
<section class="hero"><div><div class="kick"><span class="dot"></span>INTELIGENCIA DE CIBERAMENAZAS · EN ESPAÑOL</div>
<h1>La amenaza <s>no avisa.</s><br><em>Nosotros sí.</em></h1><p class="lead">Análisis técnico, actores y vulnerabilidades para Latinoamérica, con cada dato rotulado por fuente y nivel de evidencia. <span class="demo">DEMO</span></p>
<div class="cta"><a class="btn fill" href="#/dashboard">ABRIR PANEL</a><a class="btn" href="#/articulo/demo-1">LEER INFORME</a></div></div>${Radar()}</section>
<h2 class="sec">En portada</h2><p>// contenido simulado</p>
<div class="feature"><a class="card glass big" href="#/articulo/${f.id}"><div><span class="tag ${f.col}">${f.tag}</span> <span class="demo">DEMO</span></div><h3>${esc(f.title)}</h3><p style="max-width:58ch;color:#b8c4bd">${esc(f.sum)}</p><div class="meta"><span>${f.date}</span><span>${f.read}</span>${Ev(f.ev)}${Conf(f.conf)}</div></a><div class="stack">${r.slice(0,2).map(Card).join("")}</div></div>
<h2 class="sec">Últimos análisis</h2><p>// 4 piezas de muestra</p><div class="grid">${DATA.articles.map(Card).join("")}</div>`};

const Dash=(rng="7d",inc="i1")=>{const i=DATA.incidents.find(x=>x.id===inc);return `
<h2 class="sec" style="margin-top:40px">Centro de inteligencia</h2><p>// <span class="demo">DEMO</span> telemetría simulada · no representa actividad real</p>
<div class="metrics">${[["—","Incidentes verificados","g","Sin integrar",[2,4,3,6,5,8]],["—","CVE críticos","r","Pendiente NVD",[5,3,6,4,7,6]],["3","Actores (demo)","c","Fixtures",[1,2,2,3,3,3]],["0","Fuentes en vivo","a","Aún sin ingesta",[0,0,0,0,0,0.2]]].map(m=>`<div class="glass m"><small>${m[1]}</small><b class="${m[2]}">${m[0]}</b><small>${m[3]}</small>${Spark(m[4])}</div>`).join("")}</div>
<div class="two" style="margin-top:14px"><div class="glass p"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><b>Actividad simulada</b><div class="seg" role="group" aria-label="Rango">${["7d","30d","90d"].map(k=>`<button data-rng="${k}" aria-pressed="${k===rng}">${k}</button>`).join("")}</div></div><div id="trend">${Line(DATA.trend[rng])}</div></div>
<div class="glass p"><b>Sectores (ejemplo)</b><div style="margin-top:16px">${Bars(DATA.sectors)}</div></div></div>
<div class="two" style="margin-top:14px"><div class="inc" role="group" aria-label="Incidentes">${DATA.incidents.map(x=>`<button data-i="${x.id}" aria-pressed="${x.id===inc}"><span class="sev ${x.sev}" style="background:currentColor"></span><span><b>${x.name}</b><br><small class="mono" style="color:var(--mut)">${x.sector} · ${x.stage}</small></span><span class="mono" style="font-size:11px;color:var(--mut)">${x.t}</span></button>`).join("")}</div>
<div class="glass p"><span class="tag v">DETALLE</span> ${Ev("SIMULADO")}<h3 style="margin:12px 0 6px">${i.name}</h3><p style="color:#c4cec8;margin:0 0 12px">${i.d}</p>${Conf(i.conf)}<h3 style="font-size:12px;margin:18px 0 10px" class="mono g">CRONOLOGÍA</h3><ul class="tl"><li><span class="mono g">T+0</span> Detección simulada</li><li><span class="mono g">T+15m</span> Contención simulada</li><li><span class="mono g">T+2h</span> Análisis preliminar (demo)</li></ul></div></div>
<h2 class="sec">Flujo de ataque</h2><p>// ilustrativo · toca un nodo</p>${Graph()}`};

const Actors=()=>`<h2 class="sec" style="margin-top:40px">Perfiles de actores</h2><p>// <span class="demo">DEMO</span> ningún actor aquí es real ni está atribuido a incidentes reales</p>
<div class="actors">${DATA.actors.map(a=>`<div class="glass ac">${Sigil(a)}<h3>${a.name}</h3><div class="meta"><span class="tag ${a.col}">${a.kind}</span>${Ev(a.tag)}</div><p style="color:#c4cec8">${a.desc}</p>${Conf(a.conf)}
<h3 style="font:700 11px var(--mono);letter-spacing:.14em;margin:18px 0 8px" class="g">TÉCNICAS</h3><p>${a.ttps.map(t=>`<span class="tag v" title="${DATA.ttp[t]}">${t}</span> `).join("")}</p>
<h3 style="font:700 11px var(--mono);letter-spacing:.14em;margin:14px 0 8px" class="g">HISTORIAL</h3><ul class="tl">${a.hist.map(h=>`<li><span class="mono g">${h[0]}</span> ${h[1]}</li>`).join("")}</ul><p class="mono" style="font-size:11px;color:var(--mut)">Fuente: datos de ejemplo del proyecto</p></div>`).join("")}</div>`;

const Article=id=>{const a=DATA.articles.find(x=>x.id===id);if(!a)return `<div class="glass p" style="margin-top:40px">Artículo no encontrado. <a class="g" href="#/">Volver</a></div>`;
return `<article class="art"><a class="mono g" href="#/">← PORTADA</a><div style="margin-top:20px"><span class="tag ${a.col}">${a.tag}</span> <span class="demo">CONTENIDO DEMO</span></div><h1>${esc(a.title)}</h1><div class="meta">${a.date} · ${a.read} · ${Ev(a.ev)} ${Conf(a.conf)}</div>
<h3>Resumen</h3><p>${esc(a.sum)}</p><h3>Explicación técnica</h3><p>Texto de ejemplo: aquí se describiría el vector de acceso, la cadena de ejecución y los indicadores, separando hechos confirmados de hipótesis.</p>
<pre>indicador: marcador-demo\nhash: 0000…0000\ndominio: ejemplo.invalid</pre><h3>Referencias</h3><p>CVE: <span class="mono a">${esc(a.cve)}</span></p><p>ATT&amp;CK: ${a.ttp.map(t=>`<span class="tag v">${t}${DATA.ttp[t]?" · "+DATA.ttp[t]:""}</span>`).join(" ")}</p>
<h3>Atribución de la fuente</h3><p class="src">${esc(a.src)} · ${Conf(a.conf)}. Sin verificación independiente: dato de demostración.</p><h3>Flujo de ataque</h3>${Graph()}</article>`};

/* ===== ROUTER ===== */
let state={rng:"7d",inc:"i1"};
function render(){const h=location.hash.slice(1)||"/";let k="home",html;
 if(h.startsWith("/dashboard")){k="dashboard";html=Dash(state.rng,state.inc)}else if(h.startsWith("/actores")){k="actores";html=Actors()}
 else if(h.startsWith("/articulo/")){k="art";html=Article(h.split("/")[2])}else html=Home();
 $("#app").innerHTML=html;document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.r===k));
 document.title=({home:"Portada",dashboard:"Inteligencia",actores:"Actores",art:"Informe"}[k])+" — HackerNews.com.ar (demo)";scrollTo(0,0)}
function graphPick(id){const g=$(".graph");if(!g)return;g.outerHTML=Graph(id)}
addEventListener("hashchange",render);
document.addEventListener("click",e=>{const r=e.target.closest("[data-rng]"),i=e.target.closest("[data-i]"),n=e.target.closest(".gn");
 if(r){state.rng=r.dataset.rng;render()}else if(i){state.inc=i.dataset.i;const y=scrollY;render();scrollTo(0,y)}else if(n)graphPick(n.dataset.n)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("gn")){e.preventDefault();graphPick(e.target.dataset.n)}});
const T=["Telemetría <b>DEMO</b>: 0 fuentes en vivo","CVE: pendiente de integración NVD","ATT&amp;CK: enriquecimiento pendiente","Todo el contenido está marcado como simulado","Evidencia: verificado · alegación · estimación · simulado"];
$("#tk").innerHTML=[...T,...T].map(t=>`<span>${t}</span>`).join("");
render();
</script>
</body>
</html>
